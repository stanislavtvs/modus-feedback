# Added to the existing host-network edge nginx; other sites stay unchanged.
map $request_method $modus_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $modus_login_key zone=modus_login:10m rate=5r/m;
server {
    listen 95.57.206.92:8443 ssl;
    server_name 95.57.206.92;
    ssl_certificate /etc/letsencrypt/live/95.57.206.92/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/95.57.206.92/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    limit_req_status 429;
    location = /accounts/login/ {
        limit_req zone=modus_login burst=10 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8018;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_pass http://127.0.0.1:8018;
    }
}

server {
    listen 95.57.206.92:80;
    server_name modus-feedback.duckdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://modus-feedback.duckdns.org$request_uri; }
}
server {
    listen 95.57.206.92:443 ssl;
    server_name modus-feedback.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/modus-feedback.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modus-feedback.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 12m;
    limit_req_status 429;
    location = /accounts/login/ {
        limit_req zone=modus_login burst=10 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:8018;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_pass http://127.0.0.1:8018;
    }
}
